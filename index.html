<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<title>Заметки и пароли</title>
<style>
/* Сброс и защита от системного масштабирования */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { 
  height: 100%; 
  width: 100%;
  overflow: hidden; 
  -webkit-text-size-adjust: 100%; /* Запрет iOS увеличивать текст */
  text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  overscroll-behavior: none; touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s;
}

:root {
  --bg: #0b0f14; --card: #151c25; --card-hover: #1a2330;
  --border: #22303f; --text: #e8eef5; --text-dim: #8091a5;
  --accent: #4f8cff; --accent-2: #7aa7ff; --danger: #ff5d6c;
  --radius: 16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="light"] {
  --bg: #f2f5f9; --card: #ffffff; --card-hover: #f7f9fc;
  --border: #e3e9f0; --text: #0f172a; --text-dim: #64748b;
  --accent: #2563eb; --accent-2: #3b82f6;
}
.hidden { display: none !important; }

.app { height: 100dvh; display: flex; flex-direction: column; width: 100%; overflow: hidden; }

.header {
  padding: calc(var(--safe-top) + 14px) 20px 8px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.header h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 13px;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); font-size: 18px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: transform .1s, background .2s;
}
.icon-btn:active { transform: scale(.9); background: var(--card-hover); }

/* Экраны */
.view {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 0 16px calc(100px + var(--safe-bottom));
  -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column;
}
.view::-webkit-scrollbar { display: none; }

/* Поиск */
.search-wrap { position: sticky; top: 0; margin: 0 -16px; padding: 8px 16px 12px; background: var(--bg); z-index: 2; }
.search-wrap input {
  width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--border); background: var(--card);
  color: var(--text); padding: 0 16px; font-size: 16px; outline: none; transition: border-color .2s;
}
.search-wrap input:focus { border-color: var(--accent); }

/* Списки и карточки */
.list { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
  cursor: pointer; transition: transform .12s, background .2s; animation: fadeIn .25s ease;
}
.card:active { transform: scale(.98); background: var(--card-hover); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card-title { font-weight: 600; font-size: 17px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-preview { color: var(--text-dim); font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { color: var(--text-dim); font-size: 12px; margin-top: 8px; }

/* Кнопка добавления */
.fab {
  position: fixed; right: 20px; bottom: calc(88px + var(--safe-bottom));
  width: 60px; height: 60px; border-radius: 20px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border: none; color: #fff; font-size: 34px; font-weight: 300;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 10px 30px rgba(79,140,255,.45); transition: transform .12s; z-index: 10; padding-bottom: 4px;
}
.fab:active { transform: scale(.9); }

/* Нижнее меню */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: center; gap: 8px;
  padding: 8px 16px calc(8px + var(--safe-bottom));
  background: rgba(11, 15, 20, 0.85); /* Заменил color-mix на rgba для старых браузеров */
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border); z-index: 20; flex-shrink: 0;
}
[data-theme="light"] .bottom-nav { background: rgba(242, 245, 249, 0.85); }
.nav-btn {
  flex: 1; max-width: 160px; height: 54px; border-radius: 14px;
  border: none; background: transparent; color: var(--text-dim);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 11px; font-weight: 500; cursor: pointer;
  transition: color .2s, background .2s; font-family: inherit;
}
.nav-btn .nav-icon { font-size: 20px; }
.nav-btn.active { color: var(--accent); background: rgba(79, 140, 255, 0.15); }

/* ЭКРАН БЛОКИРОВКИ И КЛАВИАТУРА - ПОЛНОСТЬЮ ПЕРЕПИСАНО */
.lock-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 100%; margin: auto; padding: 10px 0; gap: 20px;
}
.lock-icon { font-size: 56px; }
.lock-msg { color: var(--text-dim); font-size: 15px; text-align: center; max-width: 260px; }

.pin-display { display: flex; gap: 14px; height: 40px; align-items: center; justify-content: center; }
.pin-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--border); transition: background .2s, transform .15s; }
.pin-dot.filled { background: var(--accent); transform: scale(1.15); }

/* Жестко заданные размеры клавиатуры */
.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 72px); /* Жестко фиксируем ширину колонки */
  gap: 16px;
  justify-content: center; /* Центрируем сетку */
  width: 100%;
  margin: 0 auto;
}
.pin-key {
  width: 72px;   /* Жестко фиксируем размер */
  height: 72px;  /* Жестко фиксируем размер */
  border-radius: 50%;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); font-size: 26px; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: transform .1s, background .2s;
  user-select: none; -webkit-user-select: none; font-family: inherit; padding: 0;
}
.pin-key:active { transform: scale(.9); background: var(--card-hover); }
.pin-key.empty { background: transparent; border: none; pointer-events: none; }

#pw-unlocked { display: flex; flex-direction: column; flex: 1; }

@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.shake { animation: shake .35s ease; }

/* Экран разблокированных паролей */
.pw-topbar { position: sticky; top: 0; margin: 0 -16px; padding: 8px 16px 12px; background: var(--bg); z-index: 2; display: flex; gap: 8px; align-items: center; }
.pw-topbar .search-wrap { margin: 0; padding: 0; position: static; background: transparent; flex: 1; }
.pw-card { display: flex; align-items: center; gap: 14px; }
.pw-avatar { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 18px; flex-shrink: 0; }
.pw-info { flex: 1; min-width: 0; }
.copy-btn { width: 44px; height: 44px; border-radius: 12px; background: transparent; border: 1px solid var(--border); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .1s, background .2s; font-family: inherit; }
.copy-btn:active { transform: scale(.9); background: var(--card-hover); }

/* Модальные окна редакторов */
.editor-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 100; animation: slideUp .22s ease; padding-top: var(--safe-top); }
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.editor-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
.editor-status { flex: 1; text-align: center; font-size: 13px; color: var(--text-dim); }
.editor-title { background: transparent; border: none; color: var(--text); font-size: 24px; font-weight: 700; padding: 8px 20px; outline: none; width: 100%; font-family: inherit; }
.editor-body { flex: 1; min-height: 0; background: transparent; border: none; color: var(--text); font-size: 17px; line-height: 1.55; padding: 8px 20px 20px; outline: none; resize: none; font-family: inherit; width: 100%; }

.pw-form { flex: 1; overflow-y: auto; padding: 8px 20px calc(24px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--text-dim); font-weight: 500; }
.field input, .field textarea { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; color: var(--text); font-size: 16px; outline: none; font-family: inherit; transition: border-color .2s; width: 100%; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 80px; }
.field-row { display: flex; gap: 8px; }
.field-row input { flex: 1; }
.mini-btn { width: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 18px; cursor: pointer; flex-shrink: 0; font-family: inherit; display: flex; align-items: center; justify-content: center; }
.mini-btn:active { background: var(--card-hover); }

.empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .6; }
.empty-sub { font-size: 14px; margin-top: 4px; opacity: .7; }

.toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-bottom)); transform: translate(-50%, 20px); background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 20px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 1000; max-width: 80%; box-shadow: 0 10px 30px rgba(0,0,0,.35); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Адаптив для очень маленьких экранов */
@media (max-height: 650px) {
  .pin-key { width: 64px; height: 64px; font-size: 22px; }
  .pin-pad { grid-template-columns: repeat(3, 64px); gap: 12px; }
  .lock-icon { font-size: 40px; margin-top: 10px; }
  .lock-screen { gap: 14px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1 id="header-title">Заметки</h1>
    <button class="icon-btn" id="theme-btn" aria-label="Тема">☀️</button>
  </header>

  <main class="view" id="view-notes">
    <div class="search-wrap">
      <input type="search" id="notes-search" placeholder="Поиск заметок..." autocomplete="off">
    </div>
    <div class="list" id="notes-list"></div>
    <div class="empty hidden" id="notes-empty">
      <div class="empty-icon">📝</div>
      <div>Нет заметок</div>
      <div class="empty-sub">Нажмите + чтобы создать</div>
    </div>
  </main>

  <main class="view hidden" id="view-passwords">
    <div id="pw-lock" class="lock-screen">
      <div class="lock-icon">🔐</div>
      <div class="lock-msg" id="pw-lock-msg">Введите PIN</div>
      <div class="pin-display" id="pin-display"></div>
      <div class="pin-pad" id="pin-pad"></div>
    </div>
    <div id="pw-unlocked" class="hidden">
      <div class="pw-topbar">
        <div class="search-wrap">
          <input type="search" id="pw-search" placeholder="Поиск..." autocomplete="off">
        </div>
        <button class="icon-btn" id="pw-lock-btn" aria-label="Заблокировать">🔒</button>
      </div>
      <div class="list" id="pw-list"></div>
      <div class="empty hidden" id="pw-empty">
        <div class="empty-icon">🔐</div>
        <div>Нет паролей</div>
        <div class="empty-sub">Нажмите + чтобы добавить</div>
      </div>
    </div>
  </main>

  <button class="fab hidden" id="fab">+</button>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="notes">
      <span class="nav-icon">📝</span><span>Заметки</span>
    </button>
    <button class="nav-btn" data-view="passwords">
      <span class="nav-icon">🔐</span><span>Пароли</span>
    </button>
  </nav>
</div>

<!-- Модальные окна -->
<div class="editor-overlay hidden" id="note-editor">
  <header class="editor-header">
    <button class="icon-btn" id="note-back" aria-label="Назад">←</button>
    <span class="editor-status" id="note-status">Сохранено</span>
    <button class="icon-btn" id="note-del" aria-label="Удалить">🗑</button>
  </header>
  <input class="editor-title" id="note-title" placeholder="Заголовок" autocomplete="off">
  <textarea class="editor-body" id="note-body" placeholder="Начните писать..."></textarea>
</div>

<div class="editor-overlay hidden" id="pw-editor">
  <header class="editor-header">
    <button class="icon-btn" id="pw-back" aria-label="Назад">←</button>
    <span class="editor-status" id="pw-status">Сохранено</span>
    <button class="icon-btn" id="pw-del" aria-label="Удалить">🗑</button>
  </header>
  <div class="pw-form">
    <div class="field">
      <label>Сервис / название</label>
      <input id="pw-service" placeholder="Google, Telegram..." autocomplete="off">
    </div>
    <div class="field">
      <label>Логин</label>
      <input id="pw-login" placeholder="Email или username" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="field">
      <label>Пароль</label>
      <div class="field-row">
        <input id="pw-pass" type="password" placeholder="••••••••" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="mini-btn" id="pw-toggle" type="button" aria-label="Показать">👁</button>
        <button class="mini-btn" id="pw-gen" type="button" aria-label="Сгенерировать">🎲</button>
      </div>
    </div>
    <div class="field">
      <label>Сайт / приложение</label>
      <input id="pw-url" placeholder="https://..." autocomplete="off" inputmode="url">
    </div>
    <div class="field">
      <label>Заметки</label>
      <textarea id="pw-notes" rows="4" placeholder="Дополнительная информация"></textarea>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const b64ToBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bytesToB64 = b => { let s = ''; const a = new Uint8Array(b); for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(ts) {
  const d = new Date(ts), now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'только что';
  if (diff < 3600) return Math.floor(diff / 60) + ' мин назад';
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}
let toastTimer;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}
function genPassword(len = 16) {
  const chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*-_=+';
  const arr = new Uint32Array(len);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(arr);
  else for (let i = 0; i < len; i++) arr[i] = Math.floor(Math.random() * 0xffffffff);
  let out = '';
  for (let i = 0; i < len; i++) out += chars[arr[i] % chars.length];
  return out;
}

const HAS_WC = !!(window.crypto && window.crypto.subtle);
async function aesDeriveKey(pin, saltBytes) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: saltBytes, iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function aesEncryptObj(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: bytesToB64(iv), ct: bytesToB64(ct) };
}
async function aesDecryptObj(key, ivB64, ctB64) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(ivB64) }, key, b64ToBytes(ctB64));
  return JSON.parse(new TextDecoder().decode(pt));
}
function xorStream(pin, len) {
  let h = 5381;
  for (let i = 0; i < pin.length; i++) h = ((h * 33) ^ pin.charCodeAt(i)) >>> 0;
  const out = new Uint8Array(len);
  for (let i = 0; i < len; i++) { h = (h * 1103515245 + 12345) >>> 0; out[i] = (h >>> 16) & 0xff; }
  return out;
}
function xorEnc(pin, str) {
  const b = new TextEncoder().encode(str), k = xorStream(pin, b.length), o = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) o[i] = b[i] ^ k[i];
  return bytesToB64(o);
}
function xorDec(pin, b64) {
  const b = b64ToBytes(b64), k = xorStream(pin, b.length), o = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) o[i] = b[i] ^ k[i];
  return new TextDecoder().decode(o);
}

const K_NOTES = 'nb.notes.v1';
const K_PW = 'nb.pw.v1';
const K_THEME = 'nb.theme.v1';
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Ошибка сохранения'); return false; } }

const state = {
  notes: lsGet(K_NOTES, []), passwords: [], theme: localStorage.getItem(K_THEME) || 'dark',
  masterKey: null, masterPin: null, pinSalt: null, pinBuffer: '', pinPurpose: 'unlock', tempPin: null,
  processing: false, currentNoteId: null, currentPwId: null, currentView: 'notes', noteSaveTimer: null, pwSaveTimer: null,
};

function renderNotes() {
  const q = ($('notes-search').value || '').trim().toLowerCase();
  const list = state.notes.slice().sort((a, b) => b.updated - a.updated).filter(n => !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q));
  const container = $('notes-list'); container.innerHTML = ''; $('notes-empty').classList.toggle('hidden', list.length > 0);
  for (const n of list) {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<div class="card-title">${escapeHtml(n.title || 'Без названия')}</div><div class="card-preview">${escapeHtml((n.body || '').slice(0, 180))}</div><div class="card-meta">${fmtDate(n.updated)}</div>`;
    card.addEventListener('click', () => openNoteEditor(n.id)); container.appendChild(card);
  }
}
function createNote() {
  const n = { id: uid(), title: '', body: '', updated: Date.now() }; state.notes.push(n); lsSet(K_NOTES, state.notes); openNoteEditor(n.id);
}
function openNoteEditor(id) {
  const n = state.notes.find(x => x.id === id); if (!n) return;
  state.currentNoteId = id; $('note-title').value = n.title; $('note-body').value = n.body;
  $('note-status').textContent = 'Сохранено'; $('note-editor').classList.remove('hidden');
  setTimeout(() => (n.title ? $('note-body') : $('note-title')).focus(), 80);
}
function saveNoteNow() {
  const n = state.notes.find(x => x.id === state.currentNoteId); if (!n) return;
  n.title = $('note-title').value; n.body = $('note-body').value; n.updated = Date.now();
  lsSet(K_NOTES, state.notes); $('note-status').textContent = 'Сохранено';
}
function scheduleSaveNote() { $('note-status').textContent = 'Сохранение...'; clearTimeout(state.noteSaveTimer); state.noteSaveTimer = setTimeout(saveNoteNow, 400); }
function closeNoteEditor(save = true) {
  if (save) saveNoteNow();
  const n = state.notes.find(x => x.id === state.currentNoteId);
  if (n && !n.title.trim() && !n.body.trim()) { state.notes = state.notes.filter(x => x.id !== n.id); lsSet(K_NOTES, state.notes); }
  state.currentNoteId = null; $('note-editor').classList.add('hidden'); renderNotes();
}

async function persistPasswords() {
  const data = { passwords: state.passwords };
  if (HAS_WC && state.masterKey) {
    const enc = await aesEncryptObj(state.masterKey, data);
    lsSet(K_PW, { mode: 'aes', salt: state.pinSalt, iv: enc.iv, ct: enc.ct });
  } else if (state.masterPin) {
    lsSet(K_PW, { mode: 'xor', data: xorEnc(state.masterPin, 'OK:' + JSON.stringify(data)) });
  }
}
function renderPasswords() {
  const q = ($('pw-search').value || '').trim().toLowerCase();
  const list = state.passwords.slice().sort((a, b) => b.updated - a.updated).filter(p => !q || (p.service || '').toLowerCase().includes(q) || (p.login || '').toLowerCase().includes(q));
  const container = $('pw-list'); container.innerHTML = ''; $('pw-empty').classList.toggle('hidden', list.length > 0);
  for (const p of list) {
    const card = document.createElement('div'); card.className = 'card pw-card';
    card.innerHTML = `<div class="pw-avatar">${escapeHtml((p.service || '?')[0].toUpperCase())}</div><div class="pw-info"><div class="card-title">${escapeHtml(p.service || 'Без названия')}</div><div class="card-preview">${escapeHtml(p.login || '')}</div></div><button class="copy-btn" aria-label="Копировать">📋</button>`;
    card.querySelector('.copy-btn').addEventListener('click', async (e) => {
      e.stopPropagation(); try { await navigator.clipboard.writeText(p.password); toast('Пароль скопирован'); } catch { toast('Не удалось скопировать'); }
    });
    card.addEventListener('click', () => openPwEditor(p.id)); container.appendChild(card);
  }
}
function createPw() {
  const p = { id: uid(), service: '', login: '', password: '', url: '', notes: '', updated: Date.now() };
  state.passwords.push(p); persistPasswords(); openPwEditor(p.id); renderPasswords();
}
function openPwEditor(id) {
  const p = state.passwords.find(x => x.id === id); if (!p) return;
  state.currentPwId = id; $('pw-service').value = p.service; $('pw-login').value = p.login;
  $('pw-pass').value = p.password; $('pw-pass').type = 'password'; $('pw-url').value = p.url; $('pw-notes').value = p.notes;
  $('pw-status').textContent = 'Сохранено'; $('pw-editor').classList.remove('hidden');
}
function savePwNow() {
  const p = state.passwords.find(x => x.id === state.currentPwId); if (!p) return;
  p.service = $('pw-service').value; p.login = $('pw-login').value; p.password = $('pw-pass').value;
  p.url = $('pw-url').value; p.notes = $('pw-notes').value; p.updated = Date.now();
  $('pw-status').textContent = 'Сохранено'; persistPasswords(); renderPasswords();
}
function scheduleSavePw() { $('pw-status').textContent = 'Сохранение...'; clearTimeout(state.pwSaveTimer); state.pwSaveTimer = setTimeout(savePwNow, 400); }
function closePwEditor(save = true) {
  if (save) savePwNow();
  const p = state.passwords.find(x => x.id === state.currentPwId);
  if (p && !p.service.trim() && !p.login.trim() && !p.password.trim()) { state.passwords = state.passwords.filter(x => x.id !== p.id); persistPasswords(); renderPasswords(); }
  state.currentPwId = null; $('pw-editor').classList.add('hidden');
}

function buildPinPad() {
  const pad = $('pin-pad'); pad.innerHTML = '';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  for (const k of keys) {
    const btn = document.createElement('button'); btn.className = 'pin-key' + (k === '' ? ' empty' : '');
    btn.textContent = k; btn.type = 'button';
    if (k === '⌫') btn.addEventListener('click', backspacePin);
    else if (k !== '') btn.addEventListener('click', () => pressPin(k));
    pad.appendChild(btn);
  }
}
function renderPinDots() {
  const d = $('pin-display'); d.innerHTML = '';
  for (let i = 0; i < 4; i++) { const dot = document.createElement('div'); dot.className = 'pin-dot' + (i < state.pinBuffer.length ? ' filled' : ''); d.appendChild(dot); }
}
function pressPin(d) {
  if (state.processing || state.pinBuffer.length >= 4) return;
  state.pinBuffer += d; renderPinDots(); if (navigator.vibrate) navigator.vibrate(10);
  if (state.pinBuffer.length === 4) setTimeout(() => handlePin(state.pinBuffer), 120);
}
function backspacePin() { if (state.processing) return; state.pinBuffer = state.pinBuffer.slice(0, -1); renderPinDots(); }
function shakePin() { const el = $('pw-lock'); el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); if (navigator.vibrate) navigator.vibrate([30, 50, 30]); }

async function handlePin(pin) {
  if (state.processing) return; state.processing = true;
  try {
    if (state.pinPurpose === 'set') {
      state.tempPin = pin; state.pinPurpose = 'confirm';
      $('pw-lock-msg').textContent = 'Повторите PIN'; state.pinBuffer = ''; renderPinDots(); state.processing = false; return;
    }
    if (state.pinPurpose === 'confirm') {
      if (pin !== state.tempPin) {
        state.pinPurpose = 'set'; state.tempPin = null;
        $('pw-lock-msg').textContent = 'PIN не совпал. Придумайте заново';
        state.pinBuffer = ''; renderPinDots(); shakePin(); state.processing = false; return;
      }
      if (HAS_WC) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        state.pinSalt = bytesToB64(salt); state.masterKey = await aesDeriveKey(pin, salt);
      } else { state.masterPin = pin; }
      state.passwords = []; await persistPasswords(); state.tempPin = null; unlockPwView(); state.processing = false; return;
    }
    const saved = lsGet(K_PW, null);
    if (!saved) { state.pinPurpose = 'set'; $('pw-lock-msg').textContent = 'Придумайте PIN из 4 цифр'; state.pinBuffer = ''; renderPinDots(); state.processing = false; return; }
    if (saved.mode === 'aes') {
      if (!HAS_WC) { toast('Нужен современный браузер'); state.processing = false; return; }
      const key = await aesDeriveKey(pin, b64ToBytes(saved.salt));
      const obj = await aesDecryptObj(key, saved.iv, saved.ct);
      state.masterKey = key; state.pinSalt = saved.salt; state.passwords = obj.passwords || [];
    } else {
      const dec = xorDec(pin, saved.data);
      if (!dec.startsWith('OK:')) throw new Error('wrong pin');
      const obj = JSON.parse(dec.slice(3)); state.masterPin = pin; state.passwords = obj.passwords || [];
    }
    unlockPwView();
  } catch (e) { state.pinBuffer = ''; renderPinDots(); shakePin(); } finally { state.processing = false; }
}

function unlockPwView() {
  state.pinBuffer = ''; renderPinDots();
  $('pw-lock').classList.add('hidden'); $('pw-unlocked').classList.remove('hidden');
  renderPasswords(); updateFab();
}
function lockPwView() {
  state.masterKey = null; state.masterPin = null; state.pinSalt = null; state.passwords = [];
  state.pinPurpose = 'unlock'; state.pinBuffer = ''; state.tempPin = null;
  $('pw-lock-msg').textContent = 'Введите PIN'; renderPinDots();
  $('pw-unlocked').classList.add('hidden'); $('pw-lock').classList.remove('hidden');
  updateFab();
}

function switchView(view) {
  state.currentView = view;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('view-notes').classList.toggle('hidden', view !== 'notes');
  $('view-passwords').classList.toggle('hidden', view !== 'passwords');
  $('header-title').textContent = view === 'notes' ? 'Заметки' : 'Пароли';

  if (view === 'passwords') {
    const saved = lsGet(K_PW, null);
    if (!state.masterKey && !state.masterPin) {
      if (!saved) {
        state.pinPurpose = 'set';
        $('pw-lock-msg').textContent = HAS_WC ? 'Придумайте PIN из 4 цифр' : 'Придумайте PIN';
      } else {
        state.pinPurpose = 'unlock'; $('pw-lock-msg').textContent = 'Введите PIN';
      }
      state.pinBuffer = ''; renderPinDots();
      $('pw-lock').classList.remove('hidden'); $('pw-unlocked').classList.add('hidden');
    } else {
      $('pw-lock').classList.add('hidden'); $('pw-unlocked').classList.remove('hidden'); renderPasswords();
    }
  }
  updateFab();
}
function updateFab() {
  const fab = $('fab');
  if (state.currentView === 'notes') fab.classList.remove('hidden');
  else fab.classList.toggle('hidden', !(state.masterKey || state.masterPin));
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  $('theme-btn').textContent = state.theme === 'dark' ? '☀️' : '🌙';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = state.theme === 'dark' ? '#0b0f14' : '#f2f5f9';
}
function toggleTheme() { state.theme = state.theme === 'dark' ? 'light' : 'dark'; localStorage.setItem(K_THEME, state.theme); applyTheme(); }

function bindEvents() {
  document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
  $('theme-btn').addEventListener('click', toggleTheme);
  $('notes-search').addEventListener('input', renderNotes);
  $('pw-search').addEventListener('input', renderPasswords);
  $('fab').addEventListener('click', () => {
    if (state.currentView === 'notes') createNote();
    else if (state.currentView === 'passwords') { if (state.masterKey || state.masterPin) createPw(); else toast('Сначала разблокируйте'); }
  });
  $('note-back').addEventListener('click', () => closeNoteEditor(true));
  $('note-title').addEventListener('input', scheduleSaveNote);
  $('note-body').addEventListener('input', scheduleSaveNote);
  $('note-del').addEventListener('click', () => {
    if (!confirm('Удалить заметку?')) return;
    state.notes = state.notes.filter(x => x.id !== state.currentNoteId); lsSet(K_NOTES, state.notes);
    state.currentNoteId = null; $('note-editor').classList.add('hidden'); renderNotes(); toast('Удалено');
  });
  $('pw-back').addEventListener('click', () => closePwEditor(true));
  ['pw-service','pw-login','pw-pass','pw-url','pw-notes'].forEach(id => $(id).addEventListener('input', scheduleSavePw));
  $('pw-toggle').addEventListener('click', () => { const inp = $('pw-pass'); inp.type = inp.type === 'password' ? 'text' : 'password'; });
  $('pw-gen').addEventListener('click', () => { $('pw-pass').value = genPassword(); $('pw-pass').type = 'text'; scheduleSavePw(); toast('Пароль сгенерирован'); });
  $('pw-del').addEventListener('click', () => {
    if (!confirm('Удалить запись?')) return;
    state.passwords = state.passwords.filter(x => x.id !== state.currentPwId); state.currentPwId = null;
    persistPasswords(); $('pw-editor').classList.add('hidden'); renderPasswords(); toast('Удалено');
  });
  $('pw-lock-btn').addEventListener('click', lockPwView);
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000) { if (state.masterKey || state.masterPin) lockPwView(); }
  });
}

function init() {
  applyTheme(); buildPinPad(); renderPinDots(); renderNotes(); bindEvents(); switchView('notes');
}
try { init(); } catch (e) { alert('Ошибка запуска: ' + e.message); }
</script>
</body>
</html>
